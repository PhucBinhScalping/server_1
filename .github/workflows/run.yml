name: Auto Fetch Stock Data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # --- BUỔI SÁNG (Giờ VN: 09:30 - 11:45) ---
    # 09:30, 09:45
    - cron: '30,45 2 * * 1-5'
    # 10:00, 10:15, 10:30, 10:45, 11:00, 11:15, 11:30, 11:45
    - cron: '0,15,30,45 3-4 * * 1-5'
    
    # --- BUỔI CHIỀU (Giờ VN: 13:15 - 15:05) ---
    # 13:15, 13:30, 13:45
    - cron: '15,30,45 6 * * 1-5'
    # 14:00, 14:15, 14:30, 14:45
    - cron: '0,15,30,45 7 * * 1-5'
    # 15:00, 15:05
    - cron: '0,5 8 * * 1-5'

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas plotly user_agent openpyxl

      - name: Execute Python Script
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add tất cả thay đổi (ví dụ: file dữ liệu mới hoặc file html cập nhật)
          git add .
          
          # Kiểm tra nếu không có thay đổi thì bỏ qua để tránh commit rỗng
          if git diff --staged --quiet; then
            echo "Không có thay đổi dữ liệu, bỏ qua commit."
          else
            git commit -m "Cập nhật dữ liệu chứng khoán tự động [skip ci]"
            git push origin main
          fi

name: Auto Fetch Stock Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 2 * * 1-5'
    - cron: '*/15 3-7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl plotly pandas requests user_agent

    - name: Execute Python Script
      run: python main.py

    - name: Commit and Push Webpage
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Nếu file index.html được tạo ra, tự động commit đẩy lên repo để GitHub Pages tự build lại
        if [ -f "index.html" ]; then
          git add index.html
          git commit -m "Cập nhật biểu đồ biến động giá và thanh khoản tự động [skip ci]" || exit 0
          git push
        else
          echo "Cảnh báo: Không tìm thấy file index.html"
          exit 1
        fi

name: Auto Fetch Stock Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 8 * * 1-5' # Tự động chạy lúc 15:30 chiều từ Thứ 2 đến Thứ 6 (Giờ VN)
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Python Script
      run: python main.py

    - name: Commit and Push Webpage
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Cập nhật dữ liệu chứng khoán tự động [skip ci]"
        git push

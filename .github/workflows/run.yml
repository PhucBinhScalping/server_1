name: Auto Fetch Stock Data
on:
  schedule:
    # 09:15 - 15:00 VN tương ứng UTC là 02:15 - 08:00
    - cron: '15,30,45 2 * * 1-5'
    - cron: '*/15 3-7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn từ GitHub
        uses: actions/checkout@v4
      
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy plotly user_agent openpyxl
          
      - name: Chạy script phân tích dữ liệu
        run: |
          python main.py
          
      - name: Tự động lưu kết quả vào kho lưu trữ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Cập nhật biểu đồ mới nhất" && git push)

name: Auto Fetch Stock Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 2 * * 1-5'
    - cron: '*/15 3-7 * * 1-5'
    - cron: '0 8 * * 1-5'
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # BỔ SUNG: Cài đặt Chrome và các thư viện hệ thống cần thiết cho Selenium trên Linux
    - name: Install Google Chrome & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Thêm selenium vào nếu bạn đang gọi trực tiếp trong mã nguồn
        pip install openpyxl plotly pandas requests user_agent selenium

    - name: Execute Python Script
      run: python main.py

    - name: Commit and Push Webpage
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add -A
        # Chạy commit, nếu không thay đổi gì thì bỏ qua một cách an toàn
        git commit -m "Cập nhật dữ liệu chứng khoán tự động [skip ci]" || exit 0
        
        git push

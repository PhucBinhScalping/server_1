name: Market Update (Vietnam Time)
on:
  workflow_dispatch:
  schedule:
    # Giờ VN: 09:00, 09:15, 09:30, 09:45 đến hết 15:45 (Thứ 2 đến Thứ 6)
    # Quy đổi sang giờ UTC (Trừ đi 7 tiếng): Từ 02:00 sáng đến 08:45 sáng UTC
    - cron: '0,15,30,45 2-8 * * 1-5'

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with: {python-version: '3.10'}
        
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl kaleido

      - name: Run Scripts (Check Vietnam Time)
        run: |
          CURRENT_HOUR_VN=$(TZ="Asia/Ho_Chi_Minh" date +%H)
          
          # Bảo vệ 2 lớp: Chỉ chạy trong khung giờ từ 9h sáng đến trước 16h chiều VN
          if [ "$CURRENT_HOUR_VN" -ge 9 ] && [ "$CURRENT_HOUR_VN" -lt 16 ]; then
            echo "Đang trong giờ giao dịch Việt Nam ($CURRENT_HOUR_VN:00). Tiến hành cập nhật..."
            # Chỉ cần chạy duy nhất file main.py (vì bên trong nó đã tự gọi file get_index_vn.py rồi)
            python main.py
          else
            echo "Ngoài giờ giao dịch ($CURRENT_HOUR_VN:00), hệ thống bỏ qua."
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

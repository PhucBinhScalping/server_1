name: Market Update (Vietnam Time)
on:
  workflow_dispatch:
  schedule:
    # Giờ VN: 09:00, 09:15, 09:30, 09:45 đến hết 15:45 (Thứ 2 đến Thứ 6)
    # Quy đổi sang giờ UTC (Trừ đi 7 tiếng): Từ 02:00 sáng đến 08:45 sáng UTC
    - cron: '0,15,30,45 2-8 * * 1-5'

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl kaleido

      - name: Run Scripts
        run: |
          echo "Kích hoạt cập nhật dữ liệu thị trường..."
          python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

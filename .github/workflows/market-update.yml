name: Market Update (Vietnam Time)

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

on:
  # Lịch chạy tự động (Giờ UTC = Giờ VN - 7)
  schedule:
    - cron: '0,20,40 * * * *'
    
    
  # Cho phép kích hoạt thủ công bằng nút "Run workflow" trên giao diện GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 datetime pytz
          
      - name: Run Index Update
        run: python update_index_only.py
      

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Thêm tất cả các file đã thay đổi/sinh ra vào Staging
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase
            git push origin main
          else
            echo "Không có dữ liệu mới để cập nhật."
          fi

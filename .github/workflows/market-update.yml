name: Market Update (Vietnam Time)

# Thêm cụm này chung group với file trên để chúng nhường nhịn nhau
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl kaleido

      - name: Run Scripts
        run: |
          echo "Kích hoạt cập nhật dữ liệu thị trường..."
          python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase  # Chống xung đột Git
            git push origin main
          else
            echo "Không có dữ liệu mới."
          fi

name: Market Update (Vietnam Time)

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

on:
  schedule:
    # 1. Chạy tất cả các mốc 15, 30, 45 phút từ 9h sáng đến 14h45 chiều VN (Giờ UTC: 2 đến 7)
    - cron: '15,30,45 2-7 * * 1-5'
    # 2. Chạy tất cả các mốc 00 và 15 phút của khung giờ 15h chiều VN (Giờ UTC: 8)
    - cron: '0,15 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl kaleido

      - name: Run Scripts
        run: |
          echo "Kích hoạt cập nhật dữ liệu thị trường..."
          python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # THAY ĐỔI Ở ĐÂY: Thêm tất cả các thay đổi (bao gồm biểu đồ hình ảnh sinh ra)
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase  # Chống xung đột Git bây giờ sẽ chạy mượt mà
            git push origin main
          else
            echo "Không có dữ liệu mới."
          fi

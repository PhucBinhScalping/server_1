name: Market Update
on:
  workflow_dispatch:
  schedule:
    # Lịch trình gộp: T2-T6, mỗi 10 phút (đáp ứng yêu cầu của bạn)
    - cron: '*/15 * * * 1-5'

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
        
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl

      - name: Run Scripts
        run: |
          # Chạy lần lượt các script cập nhật
          python get_index_vn.py
          python update_index_only.py
          python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

name: Market Update Manager

on:
  workflow_dispatch:
  schedule:
    # 02:20 đến 08:05 UTC tương ứng 09:20 đến 15:05 VN
    # Chạy mỗi 10 phút
    - cron: '20-59/10 2 * * 1-5'
    - cron: '0-5/10 8 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
        
      - name: Install dependencies
        run: pip install pandas requests pytz jinja2

      - name: Run Market Update
        run: |
          # Chỉ chạy logic cập nhật bảng VN-Index
          python -c "from get_index_vn import get_data_index; print('Cập nhật bảng VN-Index...')"
          
          # Thực hiện commit và push đè lên file index.html
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update VN Index: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main --force
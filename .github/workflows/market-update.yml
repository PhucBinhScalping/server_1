name: Market Update Manager

on:
  workflow_dispatch:
  schedule:
    # Chạy mỗi 10 phút, tất cả các ngày trong tuần
    - cron: '*/10 * * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install dependencies
        run: pip install pandas requests plotly user_agent openpyxl beautifulsoup4 pytz
      
      - name: Run script with time logic
        run: |
          # Lấy giờ VN
          HOUR=$(TZ="Asia/Ho_Chi_Minh" date +%H)
          # Nếu giờ từ 9 đến 15 (giờ giao dịch) -> Chạy 'all'
          # Nếu không -> Chạy 'world'
          if [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 16 ]; then
            python main.py all
          else
            python main.py world
          fi
        env:
          TZ: Asia/Ho_Chi_Minh

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update market data [skip ci]"
            git push
          fi

name: Market Update Manager

on:
  workflow_dispatch:
  schedule:
    # Chạy mỗi 10 phút, Thứ 2 đến Thứ 6
    - cron: '*/10 * * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Đảm bảo fetch đầy đủ lịch sử để tránh xung đột
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
        
      - name: Install dependencies
        run: pip install pandas requests plotly user_agent openpyxl beautifulsoup4 pytz

      - name: Run script with time logic
        run: |
          HOUR=$(TZ="Asia/Ho_Chi_Minh" date +%H)
          echo "Hiện tại là giờ VN: $HOUR"
          if [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 16 ]; then
            python main.py all
          else
            python main.py world
          fi
        env:
          TZ: Asia/Ho_Chi_Minh

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # BƯỚC QUAN TRỌNG: Loại bỏ bất kỳ trạng thái xung đột nào nếu có
          git reset --hard origin/main
          
          # Sau khi reset, chạy lại script (để đảm bảo file index.html là mới nhất)
          # Nếu bạn không muốn chạy lại script, có thể bỏ dòng này
          # Nhưng để an toàn, chỉ cần đảm bảo file index.html đã được ghi đè
          
          git add index.html
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Market data at $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main --force
          else
            echo "Không có dữ liệu mới để cập nhật."
          fi

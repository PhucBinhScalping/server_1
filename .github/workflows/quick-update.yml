name: Quick Update Index

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

on:
  schedule:
    # Lập lịch mặc định mỗi 30 phút cho cả ngày (Từ T2 đến T7)
    - cron: '6,36 * * * 1-6'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Bắt buộc phải có quyền này để workflow tự kích hoạt chính nó
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 plotly user_agent openpyxl kaleido pytz

      - name: Run Scripts
        run: |
          echo "Kích hoạt cập nhật dữ liệu thị trường..."
          python main.py
          python update_index_only.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.html chart_only.png
          
          if ! git diff --staged --quiet; then
            git commit -m "Quick update index: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git fetch origin main
            git merge origin/main -X ours -m "Auto merge from bot"
            git push origin main
          else
            echo "Không có dữ liệu mới."
          fi

      - name: Xử lý vòng lặp riêng cho khung 9h-15h VN (Chạy chính xác 30p/lần)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lấy giờ UTC hiện tại
          CURRENT_HOUR=$(date -u +%H)
          
          # 02:00 UTC đến 07:59 UTC tương ứng từ 9h00 đến trước 15h00 VN
          if [ "$CURRENT_HOUR" -ge 2 ] && [ "$CURRENT_HOUR" -lt 8 ]; then
            echo "Đang trong khung giờ vàng 9h-15h VN. Đợi 30 phút để tự kích hoạt lượt tiếp theo..."
            sleep 1800 # Tạm dừng 30 phút (1800 giây)
            
            echo "Kích hoạt lượt tiếp theo!"
            # Thay "quick_update.yml" bằng đúng tên file yml của bạn nếu khác
            gh workflow run "${{ github.workflow }}" --ref main
          else
            echo "Ngoài khung giờ 9h-15h VN. Chuyển sang chế độ chờ Cron mặc định của GitHub."
          fi

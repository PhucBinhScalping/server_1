name: Quick Update Index

on:
  schedule:
    # Chạy mỗi 15 phút, các ngày T2-T6
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
        
      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4
        
      - name: Run Index Update
        run: |
          # Kiểm tra giờ Việt Nam
          CURRENT_HOUR_VN=$(TZ="Asia/Ho_Chi_Minh" date +%H)
          echo "Giờ Việt Nam hiện tại: $CURRENT_HOUR_VN"
          
          # Chạy script cập nhật
          python update_index_only.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Kiểm tra xem có thay đổi không trước khi commit
          if ! git diff --staged --quiet; then
            git commit -m "Quick update index: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "Không có dữ liệu mới để cập nhật."
          fi

name: Super Quick Update All

on:
  schedule:
    # Chạy đều đặn mỗi 15 phút
    - cron: '0,15,30,45 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-market:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # Gộp toàn bộ thư viện của cả 2 file lại tại đây
        run: pip install requests pandas beautifulsoup4 datetime pytz plotly user_agent openpyxl kaleido
          
      - name: Run Index Update Only
        run: |
          echo "Đang cập nhật nhanh chỉ số..."
          python update_index_only.py

      - name: Run Main Market Update
        run: |
          echo "Đang cập nhật toàn bộ thị trường và biểu đồ ngành..."
          python main.py

      - name: Commit and Push All Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Super update market & index: $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "Không có dữ liệu mới thay đổi."
          fi

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Cập nhật diễn biến thị trường, chỉ số tài chính và giá vàng mới nhất tại Phúc Bình Scalping.">
    <title>Diễn Biến Thị Trường - Phúc Bình Scalping</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f9c851, #f15238);
            min-height: 100vh; color: #000000;
            max-width: 100%; overflow-x: hidden;
        }

        /* --- LAYOUT --- */
        .main-wrapper { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; width: 100%; }
        .container { max-width: 1200px; width: 100%; background: rgba(255, 255, 255, 0.2); padding: 40px; border-radius: 25px; backdrop-filter: blur(15px); text-align: center; }
        h1 { color: #002060; margin-bottom: 30px; font-size: 2.5em; text-transform: uppercase; }
        h2 { font-size: 1.8em; margin-bottom: 15px; }
        
        /* Khung trắng chứa dữ liệu - Cho phép tự động sinh thanh cuộn ngang khi bảng quá rộng */
        .market-update-box { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            width: 100%; 
            overflow-x: auto !important; /* ĐỔI TỪ hidden SANG auto ĐỂ HIỆN CỘT BỊ ẨN */
            -webkit-overflow-scrolling: touch; /* Giúp cuộn mượt mà trên iPhone/iPad */
        }

        /* Khung bọc chống tràn đa năng có thanh cuộn ngang khi quá rộng */
        .content-scroll-wrapper {
            width: 100% !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* --- NAVBAR --- */
        .navbar { position: sticky; top: 0; width: 100%; background: #002060; z-index: 1000; padding: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .navbar-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: flex-start; }
        .navbar-menu { display: flex; gap: 40px; list-style: none; }
        .navbar-item a { color: #ffffff; text-decoration: none; font-size: 16px; font-weight: bold; }
        .navbar-item a:hover { color: #fff200; }

        /* --- TABLES & CHARTS ON PC --- */
        table { 
            width: 100%; 
            min-width: 750px; /* Tăng chiều rộng tối thiểu để chứa đủ cả 8 cột không bị co rúm chữ */
            border-collapse: collapse; 
            font-size: 14px; 
            table-layout: auto;
        }
        th, td { 
            padding: 12px 6px; /* Thu nhỏ khoảng cách padding một chút để bảng thanh thoát */
            text-align: center; 
            border-bottom: 1px solid #eee; 
            white-space: nowrap; /* Giữ chữ số nằm trên 1 dòng đẹp đẽ */
        }
        th { background-color: #f8f9fa; }
        
        /* Kích hoạt thanh cuộn mượt cho khu vực hiển thị bảng */
        .market-update-box { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            width: 100%; 
            overflow-x: auto !important; /* Thay đổi từ hidden sang auto để kích hoạt thanh cuộn */
            -webkit-overflow-scrolling: touch;
        }

        /* --- UI ELEMENTS --- */
        .sticky-contact-btn { position: fixed; bottom: 30px; right: 30px; background-color: #002060; color: #ffffff; padding: 15px 25px; border-radius: 50px; cursor: pointer; z-index: 999; animation: pulse 2s infinite; font-weight: bold; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 32, 96, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 32, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 32, 96, 0); }
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 100%; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #002060; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        .btn-submit { width: 100%; padding: 12px; background: #002060; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-close { width: 100%; padding: 10px; background: #eee; color: #333; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }

        /* --- SỬA LỖI DI ĐỘNG TRIỆT ĐỂ (ÉP BẰNG IMPORTANT) --- */
        @media (max-width: 768px) {
            .main-wrapper { padding: 15px 10px !important; }
            .container { padding: 15px 8px !important; border-radius: 15px !important; width: 100% !important; max-width: 100% !important; }
            h1 { font-size: 1.4em !important; }
            h2 { font-size: 1.2em !important; }
            .navbar-menu { gap: 12px !important; justify-content: center !important; }
            .navbar-item a { font-size: 12px !important; }
            
            .market-update-box { padding: 10px !important; border-radius: 15px !important; width: 100% !important; overflow: hidden !important; }
            
            table { 
                min-width: 500px !important; 
                width: 100% !important;
                table-layout: auto !important; /* Ép trình duyệt tự tính toán đều các cột */
                font-size: 12px !important; 
            }

            th, td { 
                display: table-cell !important; 
                white-space: nowrap !important;
                padding: 8px 6px !important;
            }
            /* THỦ THUẬT QUYẾT ĐỊNH: Ép toàn bộ các thẻ con nội bộ của Plotly/Ảnh phải nằm đúng trong tầm kiểm soát */
            .content-scroll-wrapper div, 
            .content-scroll-wrapper opacity, 
            .content-scroll-wrapper .plotly, 
            .content-scroll-wrapper .js-plotly-plot,
            .content-scroll-wrapper svg {
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <ul class="navbar-menu">
                <li class="navbar-item"><a href="https://phucbinhscalping.online">Trang chủ</a></li>
                <li class="navbar-item active"><a href="#">Diễn biến thị trường</a></li>
                <li class="navbar-item"><a href="https://phucbinhscalping.online/bieu-do-ky-thuat-du-phong.html">Biểu đồ kỹ thuật</a></li>
                <li class="navbar-item"><a href="https://phucbinhscalping.online/tat-ca-bai-viet.html">Bài Viết</a></li>
            </ul>
        </div>
    </nav>

    <button class="sticky-contact-btn" id="openContactBtn">💬 Liên hệ tư vấn</button>

    <div class="main-wrapper">
        <div class="container">
            <h1>📈 Diễn Biến Thị Trường</h1>
            <div class="market-update-box">
                <!-- Vùng chứa biểu đồ có thanh cuộn bảo vệ -->
                <div class="content-scroll-wrapper">
                    {{CHART_DIEN_BIEN}}
                </div>
            </div>
    
            <h2 style="margin-top: 40px; color: #002060;">📈 Chỉ số Việt Nam</h2>
            <div class="market-update-box">
                <!-- Vùng chứa bảng Việt Nam -->
                <div class="content-scroll-wrapper">
                    {{TABLE_VIETNAM}}
                </div>
            </div>
            
            <h2 style="color: #002060;">🌍 Chỉ Số Thế Giới & Giá Vàng</h2>
            <div class="market-update-box" id="world-table-container">
                <!-- Vùng chứa bảng Thế giới -->
                <div class="content-scroll-wrapper">
                    {{TABLE_WORLD}}
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="contactModal" style="display:none;">
        <div class="modal-box">
            <h3>💬 Đăng Ký Tư Vấn</h3>
            <form action="https://formspree.io/f/xrewzpjl" method="POST">
                <div class="form-group">
                    <label for="name">Họ và Tên:</label>
                    <input type="text" id="name" name="Họ Tên" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại (Zalo):</label>
                    <input type="tel" id="phone" name="Số Điện Thoại" placeholder="0901234568" required>
                </div>
                <div class="form-group">
                    <label for="email">Địa chỉ Gmail:</label>
                    <input type="email" id="email" name="Gmail" placeholder="name@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Nội dung cần hỗ trợ:</label>
                    <textarea id="message" name="Nội Dung Cần Tư Vấn" rows="3" placeholder="Ví dụ: Cài đặt phần mềm..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Gửi Thông Tin Cho AD</button>
            </form>
            <button class="btn-close" id="closeContactBtn">Đóng</button>
        </div>
    </div>
    
    <script>
        const modal = document.getElementById('contactModal');
        const openBtn = document.getElementById('openContactBtn');
        const closeBtn = document.getElementById('closeContactBtn');

        openBtn.addEventListener('click', () => { modal.style.display = 'flex'; });
        closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (event) => { if (event.target === modal) { modal.style.display = 'none'; } });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Diễn Biến Thị Trường - Phúc Bình Scalping</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(to right, #f9c851, #f15238); margin: 0; min-height: 100vh; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 25px; padding: 20px; }
        .container { max-width: 1100px; width: 100%; background: rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 20px; text-align: center; }
        .market-update-box { background: #ffffff; padding: 20px; border-radius: 15px; margin-top: 20px; }
        .chart-container { width: 100%; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <h1>📈 Diễn Biến Thị Trường</h1>
            <div class="market-update-box">
                <div class="chart-container">{{CHART_DIEN_BIEN}}</div>
            </div>
        </div>

        <div class="container">
            <h1>📈 Biểu đồ Lãi suất</h1>
            <div class="market-update-box">
                <div class="chart-container">{{CHART_LAI_SUAT}}</div>
            </div>
        </div>
    </div>
</body>
</html>
